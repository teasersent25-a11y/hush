<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUSH</title>
<meta name="description" content="HUSH. Rooftop beach-club parties in Tenerife.">
<style>
:root{--bg:#0b0a1a;--fg:#ecebff;--muted:#9a97c9;--violet:#7b5cff;--teal:#2fd3c4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 110%,#2a1b6b 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;text-align:center;padding:24px}
h1{font-size:clamp(64px,18vw,160px);letter-spacing:.18em;margin:0 0 8px;padding-left:.18em;background:linear-gradient(90deg,var(--violet),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
p{margin:0;color:var(--muted);font-size:16px;letter-spacing:.06em}
.tag{margin-top:28px;font-size:12px;text-transform:uppercase;letter-spacing:.3em;color:var(--teal)}
</style>
</head>
<body>
<main>
<h1>HUSH</h1>
<p>Rooftop beach-club parties · Tenerife</p>
<p class="tag">Back very soon</p>
</main>
</body>
</html>
